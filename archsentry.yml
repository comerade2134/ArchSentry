# archsentry.yml

version: 1

rules:
  # 1. Controllers / Services must not issue direct database queries
  - id: no-direct-sql
    type: pattern
    severity: error
    description: "All database writes and queries must go through the repository layer."
    match:
      patterns:
        - "INSERT INTO"
        - "UPDATE "
        - "DELETE FROM"
        - "db.query("
        - "connection.query("
      paths:
        - "src/controllers/**"
        - "src/services/**"
        - "src/api/**"
      exclude:
        - "**/repositories/**"
        - "**/migrations/**"
        - "**/test/**"
        - "**/tests/**"
        - "**/*.test.ts"
        - "**/*.spec.ts"

  # 2. Hardcoded secret token detector
  - id: no-hardcoded-secret
    type: pattern
    severity: error
    description: "Secrets and API tokens must live in the secrets manager, not in source code."
    match:
      patterns:
        - "sk-proj-"
        - "sk-live-"
        - "AKIA"
        - "ghp_"
        - "gho_"
      paths:
        - "**/*.ts"
        - "**/*.js"
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/*.test.ts"
        - "**/*.spec.ts"

  # 3. AST Semgrep Rule: Service classes must access persistence only through repositories
  - id: services-use-repositories
    type: semgrep
    severity: error
    description: "Service classes must access persistence only through repositories."
    semgrep:
      languages: ["typescript"]
      paths:
        include: ["src/services/**/*.ts"]
      pattern: $DB.query(...)

  # 4. AST Semgrep Rule: Dangerous dynamic code execution
  - id: no-raw-dangerous-eval
    type: semgrep
    severity: error
    description: "Do not call eval() or the Function constructor in product code."
    semgrep:
      languages: ["typescript", "javascript"]
      pattern-either:
        - pattern: eval(...)
        - pattern: new Function(...)
      paths:
        exclude:
          - "**/test/**"
          - "**/*.spec.ts"
